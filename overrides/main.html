{% extends "base.html" %}

{% block extrahead %}
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <style>
    html { background: #f7f7fa; }
    html[data-prepaint-scheme="slate"],
    html[data-prepaint-scheme="slate"] body { background: #1e2129 !important; color-scheme: dark; }
    html[data-prepaint-scheme="default"],
    html[data-prepaint-scheme="default"] body {
      background: #f7f7fa !important;
      color-scheme: only light;
    }
    @media print {
      :root {
        --md-default-bg-color: #fff !important;
        --md-default-fg-color: #15151a !important;
        --md-typeset-color: #15151a !important;
      }
      html,
      html body,
      html[data-prepaint-scheme="slate"],
      html[data-prepaint-scheme="slate"] body,
      html[data-prepaint-scheme="default"],
      html[data-prepaint-scheme="default"] body {
        background: #fff !important;
        color: #111 !important;
        color-scheme: light !important;
      }
      html body .md-container,
      html body .md-main,
      html body .md-main__inner,
      html body .md-content,
      html body .md-content__inner,
      html body .md-content article,
      html body .cv-page,
      html body .cv-card,
      html body .cv-hero {
        background: #fff !important;
        background-image: none !important;
        color: #15151a !important;
        box-shadow: none !important;
      }
    }
  </style>
  <script>
    /* 在首帧绘制前确定页面底色，避免深色页面导航时闪出白屏。 */
    (function () {
      try {
        var saved = localStorage.getItem("mkdocs-theme");
        var scheme = saved === "slate" ? "slate" : "default";
        document.documentElement.setAttribute("data-prepaint-scheme", scheme);
        document.documentElement.style.backgroundColor = scheme === "slate" ? "#1e2129" : "#f7f7fa";
      } catch (e) {
        document.documentElement.setAttribute("data-prepaint-scheme", "default");
      }
    })();
  </script>
{% endblock %}
