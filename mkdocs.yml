site_name: Hassankite 的小站
site_description: 一个记录学习、生活与想法的个人网站
site_author: Hassankite
site_url: https://hassankites.github.io/

# 主题：Material
theme:
  name: material
  language: zh
  # 自定义模板目录（用于替换导航栏头像）
  custom_dir: overrides
  palette:
    # 亮色模式
    - scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    # 深色模式
    - scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    logo: material/lightbulb-on-outline

# 扩展功能：让 Markdown 能支持更多写法
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.tabbed
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  # 让 :material-图标: 短代码真正渲染为图标
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg

plugins:
  - search
  # 多语言支持：中文为主，英文为辅
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
          nav_translations:
            主页: 主页
            关于: 关于
            简历: 简历
            文章: 文章
            日志: 日志
            友链: 友链
        - locale: en
          name: English
          site_name: Hassankite's Site
          build: true
          nav_translations:
            主页: Home
            关于: About
            简历: Resume
            文章: Articles
            日志: Log
            友链: Friends

# 顶部导航栏：主页、关于(JS插入)、简历、文章、日志、友链
nav:
  - 主页: index.md
  - 简历: cv/index.md
  - 文章: blogger/index.md
  - 日志: log/index.md
  - 友链: friends/index.md

# 语言切换滑块的自定义样式和脚本
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/navigation-transition.js
  - javascripts/language-switch.js
  - javascripts/theme-switch.js
  - javascripts/print-resume.js
  - javascripts/site-stats.js
  - javascripts/about-link.js
  - javascripts/search-close.js
  - javascripts/cursor-follow.js
  - javascripts/latest-article.js
  - javascripts/home-typewriter.js
  - javascripts/home-expand.js

copyright: Copyright &copy; 2026 Hassankite

# 构建钩子：自动生成站点统计
hooks:
  - hooks/article_catalog.py
  - hooks/stats.py
